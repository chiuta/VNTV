/* ---- 52-resilience.js ---- */
/* =====================================================================
   Reziliență la erori de redare (totul local, fără telemetrie)
   Ordinea încercărilor la o eroare/blocaj pe motorul „direct”:
     1) aceeași sursă încă o dată (eroare de rețea trecătoare)
     2) altă calitate/alt fișier (la blocaj coborâm și plafonul de calitate pentru clipurile următoare)
     3) playerul P2P încorporat (dacă nu a eșuat deja pe acest browser)
     4) aceeași înregistrare pe altă instanță PeerTube de încredere
     5) abia apoi: clipul e marcat „stricat” 24 h (se sare fără așteptare, programul sincronizat rămâne neschimbat) și trecem mai departe
   După 5 clipuri la rând fără redare ne oprim și arătăm bara de erori cu acțiuni, în loc să sărim la nesfârșit.
   Fără rețea: așteptăm revenirea conexiunii, nu consumăm programul.
   ===================================================================== */
const BAD_MS = 864e5, CHAIN_MAX = 5, LOG_MAX = 60;
S.errChain = 0; S.badRun = 0; S.halted = false; S.qCap = 0; S.clean = 0; S.waitOnline = false;

/* ---- jurnal local (max 60 de intrări, în localStorage) ---- */
function errLog(){ const a = store.get("errLog", []); return Array.isArray(a) ? a : []; }
function logErr(it, kind, code){
  try{
    const cn = navigator.connection || {};
    const a = errLog(); a.push({t:new Date().toISOString(), host:it?._h || it?.v?.host || "", id:it?.v?.id || it?.key || "", kind, code:code ?? null,
      res:it?._cands?.[it._ci]?.res ?? null, mode:PL.mode, net:cn.effectiveType || "", online:navigator.onLine, ver:BUILD.version || ""});
    store.set("errLog", a.slice(-LOG_MAX));
  }catch(e){ /* stocare indisponibilă */ }
}
function errLogRow(){ const n = errLog().length; return `<div class="grp">${esc(t("logGrp"))}</div><div class="scr"><button class="btn" id="goLog">${esc(t("logRow", {n}))}</button><p class="hintp">${esc(t("logHint"))}</p></div>`; }
$("#lbody").addEventListener("click", async e => {
  if (!e.target.closest("#goLog")) return;
  const a = errLog(); if (!a.length){ toast(t("logEmpty"), 2600); return; }
  toast(t((await copyText(JSON.stringify(a, null, 1))) ? "logCopied" : "logEmpty"), 3200);
});

/* ---- clipuri „stricate” (24 h) ---- */
const vidKey = it => (it?._h || it?.v?.host || "") + "/" + (it?.v?.id || it?.key || "");
function isBadVid(it){ if (!it?.v) return false; const m = store.get("badVids", {}); const t0 = m && m[vidKey(it)]; return !!t0 && Date.now() - t0 < BAD_MS; }
function markBad(it){
  if (!it?.v) return;
  const m = store.get("badVids", {}) || {}, now = Date.now();
  for (const k of Object.keys(m)) if (now - m[k] > BAD_MS) delete m[k];
  m[vidKey(it)] = now; store.set("badVids", m);
}
function resetItemErr(it){ it._again = 0; it._tries = 0; it._embTried = 0; it._hostTried = 0; it._h = null; }

/* ---- bara de erori cu acțiuni ---- */
let errTimer = 0;
function showErr(msg, sticky){
  if (KIOSK) return;
  $("#errmsg").textContent = msg; $("#errbar").hidden = false; clearTimeout(errTimer);
  if (!sticky) errTimer = setTimeout(hideErr, 7000);
}
function hideErr(){ clearTimeout(errTimer); const b = $("#errbar"); if (b) b.hidden = true; }
const errWhy = (kind, code) => kind === "stall" ? t("errStall") : code === 2 ? t("errNet") : code === 3 ? t("errDecode") : code === 4 ? t("errSrc") : code === 1 ? t("errAbort") : t("errSrc");
const resLbl = c => c && c.res ? c.res + "p" : "HLS";

/* ---- altă instanță PeerTube pentru aceeași înregistrare ---- */
async function videoFromAltHost(it){
  if (!it?.v || it._hostTried) return null; it._hostTried = 1;
  const hosts = [...new Set([VN_HOST, ...P.sources.map(s => s.host)])].filter(h => h !== it.v.host && okHost(h)).slice(0, 3);
  for (const h of hosts){
    try{ const info = await getVideo({host:h, id:it.v.id}); if (info && (info.files?.length || info.streamingPlaylists?.length)) return {info, host:h}; }catch(e){ /* următoarea */ }
  }
  return null;
}

/* ---- reluarea clipului curent, de unde a rămas ---- */
function resumeAt(pos){ return S.live ? liveOffset(S.idx) : pos; }
function retryAt(it, ci, why){
  const c = it._cands[ci]; if (!c) return false;
  it._ci = ci; const pos = resumeAt(curTime());
  showErr(`${why} → ${resLbl(c)}`);
  V.removeAttribute("src"); try{ V.load(); }catch(e){ /* ignorat */ }
  playDirect(it, c.url, pos);
  return true;
}
function waitOnlinePlay(it){
  S.waitOnline = true; S._pos = curTime(); $("#spin").classList.add("show");
  showErr(t("errOffline"), true); logErr(it, "offline");
}
addEventListener("online", () => {
  if (!S.waitOnline) return; S.waitOnline = false; hideErr();
  const it = S.items[S.idx]; if (it){ resetItemErr(it); play(S.idx, {offset: S.live ? undefined : S._pos}); }
});

async function directFail(kind, code){
  const it = S.items[S.idx]; if (!it || PL.mode !== "direct") return;
  const tok = S.playTok; clearTimeout(stallTimer);
  logErr(it, kind, code);
  if (navigator.onLine === false){ waitOnlinePlay(it); return; }
  const why = errWhy(kind, code);
  if (kind === "error" && code === 2 && !it._again){ it._again = 1; if (retryAt(it, it._ci, why)) return; }      // 1) aceeași sursă
  if (kind === "stall"){ const c = it._cands?.[it._ci]; if (c && c.res){ S.qCap = Math.max(240, nextLowerRes(it, c.res)); S.clean = 0; } }
  if (it._cands && it._ci + 1 < it._cands.length && it._tries < 4){                                                 // 2) altă calitate/alt fișier
    it._tries++; if (retryAt(it, it._ci + 1, why)) return;
  }
  if (!it._embTried && P.net !== "direct" && !S.p2pBroken && !p2pRecentlyBad() && it.v){                            // 3) playerul P2P
    it._embTried = 1; showErr(`${why} → P2P`); playEmbed(it, resumeAt(curTime())); return;
  }
  const alt = await videoFromAltHost(it); if (tok !== S.playTok) return;                                            // 4) altă instanță
  if (alt){
    it._h = alt.host; it._cands = srcList(alt.info); it._ci = 0; it._tries = 0; it._again = 0;
    if (it._cands.length && retryAt(it, 0, `${why} → ${alt.host}`)) return;
  }
  markBad(it); logErr(it, "giveup");                                                                               // 5) renunțăm la clip
  if (++S.errChain >= CHAIN_MAX){ S.halted = true; $("#spin").classList.remove("show"); showErr(t("errChain"), true); return; }
  showErr(`${why} → ${t("errBtnSkip").toLowerCase()}`);
  setTimeout(() => { if (tok === S.playTok) next(true); }, 900);
}
function nextLowerRes(it, res){ const l = (it._cands || []).map(c => c.res).filter(r => r && r < res).sort((a, b) => b - a); return l[0] || res; }
function clipEnded(){                                                    // clip terminat fără probleme: după 4 la rând relaxăm plafonul de calitate
  const it = S.items[S.idx]; if (it && !it._tries && ++S.clean >= 4 && S.qCap){ S.qCap = 0; S.clean = 0; }
}

/* ---- preîncărcarea clipului următor (doar metadate): încălzește conexiunea și arată din timp dacă fișierul e stricat ---- */
const PRE = document.createElement("video"); PRE.preload = "metadata"; PRE.muted = true; PRE.setAttribute("playsinline", "");
function preloadNext(nx, info){
  try{
    if (netMode() !== "direct" || slowNet() || ecoOn()){ PRE.removeAttribute("src"); return; }
    const l = srcList(info); if (!l.length) return;
    nx._preBad = 0; PRE.onerror = () => { nx._preBad = 1; logErr(nx, "pre", PRE.error && PRE.error.code); };
    PRE.src = l[0].url;
  }catch(e){ /* ignorat */ }
}

/* ---- acțiunile din bara de erori ---- */
$("#eLow").onclick = () => { P.quality = "480"; savePrefs(); S.halted = false; S.errChain = 0; hideErr(); const it = S.items[S.idx]; if (it) resetItemErr(it); play(S.idx, {offset: resumeAt(curTime())}); };
$("#eEng").onclick = () => { P.net = PL.mode === "direct" ? "p2p" : "direct"; S.p2pBroken = false; savePrefs(); S.halted = false; S.errChain = 0; hideErr(); const it = S.items[S.idx]; if (it) resetItemErr(it); play(S.idx, {offset: resumeAt(curTime())}); };
$("#eRetry").onclick = () => { S.halted = false; S.errChain = 0; hideErr(); const it = S.items[S.idx]; if (it) resetItemErr(it); play(S.idx, {offset: resumeAt(curTime())}); };
$("#eSkip").onclick = () => { hideErr(); next(); };

/* ---- 55-subs.js ---- */
/* =====================================================================
   Subtitrări: din PeerTube (inclusiv transcrierile automate), traduse pe loc când nu există
   în limba aleasă. Se afișează ca strat propriu, deci merg și în modul direct, și în P2P.
   ===================================================================== */
const SUB = { cues:[], lang:null, tok:0, last:null, avail:[] };
function subsReset(){ SUB.cues = []; SUB.lang = null; SUB.last = null; SUB.avail = []; $("#subt").textContent = ""; $("#subs").classList.remove("on"); }
async function loadSubs(it){
  const tok = ++SUB.tok;
  if (!O.subs || !it.v) return;
  try{
    const list = await getCaptions(it.v);
    if (tok !== SUB.tok) return;
    SUB.avail = list;
    const pick = list.find(c => c.lang === P.lang) || list.find(c => c.lang === "en") || list[0];
    if (!pick) return;
    const r = await within(fetch(pick.url), 10000);
    if (!r.ok || tok !== SUB.tok) return;
    SUB.cues = parseVTT(await r.text()); SUB.lang = pick.lang;
    if (SUB.lang !== P.lang && TX.kind !== "mymemory") need(SUB.cues.map(c => c.text));
  }catch(e){}
}
/* comutator rapid (butonul CC și tasta T): pornit/oprit, cu reîncărcarea subtitrărilor clipului curent */
function syncSubsBtn(){
  const b = $("#bsubs"); if (!b) return;
  b.classList.toggle("on", !!O.subs); b.setAttribute("aria-pressed", O.subs ? "true" : "false");
}
function toggleSubs(){
  O.subs = O.subs ? 0 : 1;
  applyOverlays();
  const it = S.items[S.idx];
  if (O.subs && it){ SUB.last = null; loadSubs(it); }
  if (isOpen("layers")) renderLayers();
  toast(t(O.subs ? "subsOn" : "subsOff"), 1800);
}
function subsAt(time){
  const el = $("#subs");
  if (!O.subs || !SUB.cues.length){ if (SUB.last !== null){ SUB.last = null; $("#subt").textContent = ""; el.classList.remove("on"); } return; }
  const c = SUB.cues.find(x => time >= x.start && time < x.end);
  const txt = c ? (SUB.lang === P.lang ? c.text : (SUB.lang === "en" ? tr(c.text) : c.text)) : "";
  if (txt !== SUB.last){ SUB.last = txt; $("#subt").textContent = txt; el.classList.toggle("on", !!txt); }
}

/* ---- 56-share.js ---- */
/* =====================================================================
   Distribuire: fiecare video are o ancoră proprie (#v=gazdă/id).
   - adresa din bara browserului se actualizează la fiecare video, deci poate fi copiată oricând;
   - butonul „Distribuie” (și tasta E) folosește meniul de partajare al sistemului sau copiază linkul;
   - un link cu ancoră deschide direct acel video (după apăsarea „Start”, cerută de browsere pentru sunet).
   ===================================================================== */
const DL_RE = /^#v=([a-z0-9.-]+(?::\d{1,5})?)\/([A-Za-z0-9_-]{1,64})$/i;
function deepLink(){ const m = DL_RE.exec(location.hash); return m && okHost(m[1]) ? {host:m[1], id:m[2]} : null; }
function shareUrl(it){
  if (!it) return null;
  if (!it.v) return it.link || null;                          // fără trailer: pagina titlului pe videoneat.com
  const base = location.protocol === "file:" ? location.href.split("#")[0] : location.origin + location.pathname;
  return `${base}#v=${it.v.host}/${it.v.id}`;
}
function setAnchor(it){
  if (KIOSK || !it || !it.v) return;
  try{ history.replaceState(null, "", "#v=" + it.v.host + "/" + it.v.id); }catch(e){ /* context fără istoric (iframe, sandbox) */ }
}
async function shareItem(it){
  it = it || S.items[S.idx];
  const url = shareUrl(it); if (!url) return;
  const title = tr(it.title) + " · VNTV";
  try{ if (navigator.share){ await navigator.share({title, text:title, url}); return; } }
  catch(e){ if (e && e.name === "AbortError") return; }
  try{ await navigator.clipboard.writeText(url); toast(t("shareCopied"), 2600); return; }catch(e){ /* fără permisiune pentru clipboard */ }
  const ta = document.createElement("textarea");
  ta.value = url; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;left:-9999px;opacity:0";
  document.body.appendChild(ta); ta.select();
  let done = false; try{ done = document.execCommand("copy"); }catch(e){ /* indisponibil */ }
  ta.remove();
  if (done) toast(t("shareCopied"), 2600); else toast(url, 9000);   // ultima soluție: linkul apare în mesaj, ca să poată fi copiat manual
}

/* Hosturile de încredere pentru linkuri directe: VideoNeat/TROM și sursele adăugate de spectator.
   Pentru oricare altul cerem confirmarea (altfel un link ostil ar putea deschide un player străin fără știrea spectatorului). */
function trustedHost(h){ return h === VN_HOST || P.sources.some(s => s.host === h); }
async function itemFromDeepLink(dl){
  const same = x => x && x.v && x.v.host === dl.host && x.v.id === dl.id;
  const known = (S.items || []).find(same) || (DATA.all || []).find(same) || Object.values(DATA.pt || {}).flat().find(same);
  if (known) return {...known};
  if (!trustedHost(dl.host)){
    const msg = t("dlConfirm", {h:dl.host});
    const yes = await FFF.dialog.confirm(msg, {danger:true});
    if (!yes) return null;
  }
  try{
    const j = await getVideo(dl);
    if (!j || j.isLive || !(j.duration > 0) || j.nsfw) return null;
    return fromPT({...j, uuid:j.uuid || dl.id}, dl.host);
  }catch(e){ return null; }
}
async function openDeepLink(force){
  const dl = deepLink(); if (!dl) return false;
  const cur = S.items[S.idx];
  if (!force && cur && cur.v && cur.v.host === dl.host && cur.v.id === dl.id) return true;   // deja rulează
  const it = await itemFromDeepLink(dl);
  if (!it) return false;
  playItemNow(it);
  return true;
}
addEventListener("hashchange", () => { if (S.started && !KIOSK) openDeepLink(); });

/* ---- 57-screen.js ---- */
/* =====================================================================
   Ecran: trimite canalul pe alt ecran — Cast/AirPlay, PiP, fereastră separată, link + QR pentru alt dispozitiv
   (generatorul QR este același encoder compact, mod octeți, folosit și în FASCICUL; fără resurse externe)
   ===================================================================== */
const QR=(()=>{
const ECC=[[-1,7,10,15,20,26,18,20,24,30,18,20,24,26,30,22,24,28,30,28,28,28,28,30,30,26,28,30,30,30,30,30,30,30,30,30,30,30,30,30,30],
[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28]];
const NB=[[-1,1,1,1,1,1,2,2,2,2,4,4,4,4,4,6,6,6,6,7,8,8,9,9,10,12,12,12,13,14,15,16,17,18,19,19,20,21,22,24,25],
[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49]];
const FB=[1,0]; // biți format: L=1, M=0
const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=(v/7|0)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
const cap=(v,l)=>(raw(v)>>3)-ECC[l][v]*NB[l][v];
const gm=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
const gen=d=>{const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=gm(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=gm(root,2)}return r};
const rem=(data,g)=>{const r=g.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);g.forEach((c,i)=>r[i]^=gm(c,f))}return r};
function make(text){
  const bytes=[...new TextEncoder().encode(text)];
  const fit=l=>{for(let v=1;v<=40;v++){if(4+(v<10?8:16)+bytes.length*8<=cap(v,l)*8)return v}return 0};
  const vm=fit(1),vl=fit(0);let l,v;
  if(vm&&vm<=20){l=1;v=vm}else if(vl){l=0;v=vl}else throw new Error('Cod prea lung pentru QR');
  const bits=[];const put=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>>i)&1)};
  put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
  const cb=cap(v,l)*8;put(0,Math.min(4,cb-bits.length));while(bits.length%8)bits.push(0);
  for(let p=0xEC;bits.length<cb;p^=0xEC^0x11)put(p,8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];data.push(b)}
  // blocuri + ECC
  const nb=NB[l][v],be=ECC[l][v],rc=raw(v)>>3,ns=nb-rc%nb,sl=(rc/nb|0),g=gen(be),blocks=[];
  for(let i=0,k=0;i<nb;i++){const dl=sl-be+(i<ns?0:1);const d=data.slice(k,k+dl);k+=dl;const e=rem(d,g);if(i<ns)d.push(0);blocks.push(d.concat(e))}
  const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==sl-be||j>=ns)all.push(b[i])});
  // matrice
  const size=v*4+17,m=Array.from({length:size},()=>new Array(size).fill(false)),f=Array.from({length:size},()=>new Array(size).fill(false));
  const set=(x,y,d)=>{m[y][x]=d;f[y][x]=true};
  for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
  const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,d!==2&&d!==4)}};
  finder(3,3);finder(size-4,3);finder(3,size-4);
  const ap=[];if(v>1){const n=(v/7|0)+2,st=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2;ap.push(6);for(let p=size-7;ap.length<n;p-=st)ap.splice(1,0,p)}

const HIST_MAX = 200, LIST_MAX = 30, LIST_ITEMS = 300, LINK_TTL = 3 * 864e5, SUB_TTL = 6 * 36e5, AUTO_CHECK = 24;

/* ---- curățarea datelor din stocare / din fișiere importate (nu sunt de încredere) ---- */
function libClean(f){
  const c = cleanFav(f); if (!c) return null;
  const s = (x, n) => typeof x === "string" ? x.slice(0, n) : null;
  return {key:c.key, src:c.src === "pt" ? "pt" : "vn", id:typeof c.id === "number" || typeof c.id === "string" ? c.id : "", title:s(c.title, 300) || "", ex:s(c.ex, 400) || "",
    link:c.link, cats:Array.isArray(c.cats) ? c.cats.filter(Number.isFinite).slice(0, 8) : [], catLabel:s(c.catLabel, 60), img:c.img,
    year:c.year == null ? null : String(c.year).slice(0, 8), len:s(c.len, 60), source:s(c.source, 80), sourceUrl:c.sourceUrl, v:c.v,
    dur:fin(c.dur) > 0 ? fin(c.dur) : null, preview:c.preview, kind:c.kind === "full" ? "full" : "trailer", licence:s(c.licence, 60)};
}
function cleanHist(h){
  if (!h || typeof h !== "object") return null;
  const it = libClean(h.it); if (!it) return null;
  return {it, pos:Math.max(0, fin(h.pos)), dur:Math.max(0, fin(h.dur)), at:fin(h.at), done:!!h.done};
}
function cleanList(l){
  if (!l || typeof l !== "object" || Array.isArray(l)) return null;
  const seen = new Set(), items = [];
  for (const x of (Array.isArray(l.items) ? l.items : []).slice(0, LIST_ITEMS)){ const c = libClean(x); if (c && !seen.has(c.key)){ seen.add(c.key); items.push(c); } }
  const o = {id:typeof l.id === "string" && /^[a-z0-9]{3,12}$/.test(l.id) ? l.id : rid(), name:(typeof l.name === "string" ? l.name.trim().slice(0, 60) : "") || "—", items};
  const sb = l.sub;
  if (sb && typeof sb === "object" && okHost(sb.host) && typeof sb.pid === "string" && /^[A-Za-z0-9_-]{4,64}$/.test(sb.pid))
    o.sub = {host:sb.host, pid:sb.pid, at:fin(sb.at), added:Math.max(0, fin(sb.added) | 0), err:typeof sb.err === "string" ? sb.err.slice(0, 120) : ""};

const HIST = (() => { const a = store.get("hist", []); return (Array.isArray(a) ? a : []).slice(0, HIST_MAX).map(cleanHist).filter(Boolean); })();

/* ---- istoric: se înregistrează când pornește redarea; poziția se salvează la ~5 s ---- */
let HCUR = null, hSaved = 0;
function histStart(it){
  if (KIOSK || P.hist === false || !it || !it.v) return;
  if (HCUR && HCUR.it.key === it.key) return;
  const snap = libClean(favSnapshot(it)); if (!snap) return;
  const i = HIST.findIndex(h => h.it.key === snap.key);
  const h = i >= 0 ? HIST.splice(i, 1)[0] : {it:snap, pos:0, dur:snap.dur || 0, at:0, done:false};
  h.it = snap; h.at = Date.now(); h.done = false; if (i < 0) h.pos = 0;
  HIST.unshift(h); HIST.length = Math.min(HIST.length, HIST_MAX); HCUR = h; histSave(); hSaved = Date.now(); syncResumeBox();
}
function histTick(c, d){

  HCUR.pos = c; if (d > 0) HCUR.dur = d;
  if (d > 0 && c >= d - 2){ HCUR.done = true; HCUR.pos = 0; }
  if (Date.now() - hSaved > 5000){ hSaved = Date.now(); histSave(); }
}

function pageUrl(it){ return it.link || (it.v ? `https://${it.v.host}/w/${it.v.id}` : ""); }

const fileSafe = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40) || "lista";

function importLists(text){

  let n = 0;

/* ---- abonamente: liste publice PeerTube (/w/p/<id>) ---- */
function parsePlaylistUrl(url){
  try{
    const u = new URL(String(url).trim());
    if (u.protocol !== "https:" || !okHost(u.host)) return null;
    const m = u.pathname.match(/^\/(?:w\/p|videos\/watch\/playlist|video-playlists)\/([A-Za-z0-9_-]{4,64})\/?$/);
    return m ? {host:u.host, pid:m[1]} : null;
  }catch(e){ return null; }
}
async function fetchPlaylist(host, pid){
  const base = `https://${host}/api/v1/video-playlists/${encodeURIComponent(pid)}`;
  const info = await getJSON(base, 10000);
  const items = [];
  for (let start = 0; start < LIST_ITEMS; start += 100){
    const j = await getJSON(`${base}/videos?start=${start}&count=100`, 15000);
    for (const e of (j.data || [])){
      const v = e && e.video;
      if (!v || typeof v.uuid !== "string" || v.isLive || !(v.duration > 0) || v.nsfw) continue;
      const c = libClean(fromPT(v, host)); if (c && !items.some(x => x.key === c.key)) items.push(c);
    }
    if (!j.data || j.data.length < 100 || start + 100 >= (j.total || 0)) break;
  }
  return {name:String(info.displayName || info.name || pid).slice(0, 60), items:items.slice(0, LIST_ITEMS)};
}
async function refreshSub(l){
  if (!l || !l.sub) return false;
  try{
    const r = await fetchPlaylist(l.sub.host, l.sub.pid);
    const old = new Set(l.items.map(x => x.key));
    l.sub.added = old.size ? r.items.filter(x => !old.has(x.key)).length : 0;
    l.items = r.items; if (r.name && r.name !== "—") l.name = r.name;
    l.sub.at = Date.now(); l.sub.err = "";
    listChanged(); return true;
  }catch(e){
    l.sub.err = String(e && e.status ? "HTTP " + e.status : (e && e.message) || "error").slice(0, 120); l.sub.at = Date.now(); listsSave(); return false;
  }
}
async function subscribe(url){
  const p = parsePlaylistUrl(url);
  if (!p){ toast(t("libSubBad"), 3500); return; }
  if (LISTS.some(l => l.sub && l.sub.host === p.host && l.sub.pid === p.pid)){ toast(t("libSubDup"), 3000); return; }
  if (LISTS.length >= LIST_MAX){ toast(t("libMax"), 3200); return; }
  LIB.subBusy = true; renderLib();
  try{
    const r = await fetchPlaylist(p.host, p.pid);
    if (!r.items.length){ toast(t("libSubEmpty"), 3500); }
    else {
      LISTS.push({id:rid(), name:r.name, items:r.items, sub:{host:p.host, pid:p.pid, at:Date.now(), added:0, err:""}}); listChanged();
      toast(t("libSubOk", {n:r.name, c:r.items.length}), 3500);
    }
  }catch(e){ toast(t("libSubErr", {e:e && e.status ? "HTTP " + e.status : (e && e.message) || "error"}), 4500); }
  LIB.subBusy = false; if (isOpen("lib")) renderLib();
}
async function autoRefreshSubs(){
  const due = LISTS.filter(l => l.sub && Date.now() - l.sub.at > SUB_TTL).slice(0, 3);
  if (!due.length || navigator.onLine === false) return;
  for (const l of due) await refreshSub(l);
  if (isOpen("lib")) renderLib();
}

/* ---- verificarea legăturilor: înregistrarea mai există pe instanța ei? (404/410 = nu; erorile de rețea nu contează ca „stricat”) ---- */
async function probe(host, id){
  try{ await getJSON(`https://${host}/api/v1/videos/${encodeURIComponent(id)}`, 8000); return true; }
  catch(e){ return e && (e.status === 404 || e.status === 410) ? false : null; }
}
async function checkOne(it){

    const hosts = [...new Set([VN_HOST, ...P.sources.map(s => s.host)])].filter(h => h !== it.v.host && okHost(h)).slice(0, 3);

function trackedItems(){

async function runChecks(force){
  if (LIB.chk && LIB.chk.running) return;
  if (navigator.onLine === false){ if (force) toast(t("libOffline"), 3000); return; }
  const now = Date.now();
  let todo = trackedItems().filter(x => force || !LINKS[x.key] || now - LINKS[x.key].at > LINK_TTL);
  if (!force) todo = todo.slice(0, AUTO_CHECK); else todo = todo.slice(0, LIST_ITEMS);
  if (!todo.length){ if (force) toast(t("libAllFresh"), 2600); return; }
  const st = LIB.chk = {running:true, done:0, total:todo.length, dead:0, unk:0};
  if (isOpen("lib")) renderLib();
  let k = 0;
  const worker = async () => {
    while (k < todo.length){
      const it = todo[k++];
      const r = await checkOne(it);
      if (r === null) st.unk++; else { LINKS[it.key] = {ok:r, at:Date.now()}; if (r === false) st.dead++; }
      st.done++; if (isOpen("lib") && LIB.tab === "links") renderLib();
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  st.running = false; linksSave(); renderChannels(); syncResumeBox();

}

const cv = $("#static"), cx = cv.getContext("2d"); let staticRAF = 0;
function noise(ms){
  if (document.body.classList.contains("eco")){ cv.style.opacity = .9; cx.fillStyle = "#111"; cx.fillRect(0, 0, cv.width, cv.height); setTimeout(() => cv.style.opacity = 0, Math.min(ms, 200)); return; }
  cancelAnimationFrame(staticRAF); cv.style.opacity = .9; const end = performance.now() + ms;
  const img = cx.createImageData(cv.width, cv.height), d = img.data;
  (function f(now){
    for (let i = 0; i < d.length; i += 4){ const g = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = g; d[i + 3] = 255; }
    cx.putImageData(img, 0, 0);
    if (now < end) staticRAF = requestAnimationFrame(f); else cv.style.opacity = 0;
  })(performance.now());
}

function syncPlay(){ $("#bplay").innerHTML = icon(isPaused() ? "play" : "pause"); if (isPaused() && S.started) showUI(true); else kickUI(); }

}

$("#bplay").onclick = togglePlay; $("#bnext").onclick = () => next(); $("#bprev").onclick = prev; $("#bmute").onclick = toggleMute;

/* ---- ascunderea automată a interfeței ---- */
let uiTimer = 0;
function showUI(stay){ if (KIOSK) return; document.body.classList.add("ui"); clearTimeout(uiTimer); if (!stay) uiTimer = setTimeout(hideUI, TOUCH ? 4500 : 3200); }
function hideUI(){ if (anyPanel() || (isPaused() && S.started && PL.started) || !S.started) return; document.body.classList.remove("ui"); }
function kickUI(){ showUI(false); }
document.addEventListener("mousemove", kickUI, {passive:true});

/* ---- atingere: atingere = comenzi, dublă atingere laterală = ±10 s, glisare = clip / canal ---- */
let tStart = null, lastTap = null, tapTimer = 0;
const app = $("#app");
// containerul are overflow:hidden, dar focalizarea unui element dintr-un panou ascuns îl poate derula; îl ținem mereu fix
function resetAppScroll(){ if (app.scrollLeft || app.scrollTop){ app.scrollLeft = 0; app.scrollTop = 0; } }
app.addEventListener("scroll", resetAppScroll);
addEventListener("scroll", () => { if (scrollX || scrollY) scrollTo(0, 0); });
app.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") tStart = {x:e.clientX, y:e.clientY, tg:e.target}; }, {passive:true});
app.addEventListener("pointerup", e => {
  if (!tStart || !S.started || KIOSK){ tStart = null; return; }
  const dx = e.clientX - tStart.x, dy = e.clientY - tStart.y, tg = tStart.tg; tStart = null;
  if (tg.closest("#ctl,.panel,#upnext,#unmute,#splash")) return;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)){ dx < 0 ? next() : prev(); return; }
  if (Math.abs(dy) > 70){ switchChannel(dy < 0 ? S.chIdx + 1 : S.chIdx - 1); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12){
    const now = Date.now(), x = e.clientX, side = x < innerWidth * .35 ? "l" : x > innerWidth * .65 ? "r" : null;
    const toggle = () => document.body.classList.contains("ui") ? (clearTimeout(uiTimer), hideUI()) : kickUI();
    if (side && lastTap && lastTap.side === side && now - lastTap.t < 320){ clearTimeout(tapTimer); lastTap = {t:now, side}; seekBy(side === "l" ? -10 : 10); ripple(side); return; }
    lastTap = {t:now, side};
    if (side){ clearTimeout(tapTimer); tapTimer = setTimeout(toggle, 280); } else toggle();
  }
});
app.addEventListener("click", e => {
  if (e.pointerType && e.pointerType !== "mouse") return;
  if (!S.started || KIOSK || e.target.closest("#ctl,.panel,#upnext,#unmute,#splash,button,a,input")) return;
  if (anyPanel()) closePanels(); else togglePlay();
});
app.addEventListener("dblclick", e => { if (!TOUCH && !KIOSK && !e.target.closest("#ctl,.panel,#splash")) toggleFull(); });

/* ---- tastatură și telecomandă ---- */
let digits = "", digitTimer = 0, kioskKeys = [];
document.addEventListener("keydown", e => {
  if (KIOSK){  // în chioșc: doar M (sunet) și secvența K-K-K pentru a ieși
    if (e.key === "m" || e.key === "M") toggleMute();
    kioskKeys = [...kioskKeys, e.key.toLowerCase()].slice(-3);
    if (kioskKeys.join("") === "kkk"){ location.search = ""; }
    return;
  }
  if (!S.started){ if ((e.key === "Enter" || e.key === " ") && !e.target.closest("button,a,input")){ e.preventDefault(); start(); } return; }
  if (e.target.matches("input[type=search],input[type=text]")){ if (e.key === "Escape") e.target.blur(); return; }
  const k = e.key;
  if (/^[0-9]$/.test(k) && !anyPanel()){
    digits += k; clearTimeout(digitTimer);
    $("#osdn").textContent = digits.padStart(2, "–"); $("#osdnm").textContent = ""; $("#osd").classList.add("show");
    digitTimer = setTimeout(() => { const n = parseInt(digits, 10); digits = ""; if (n >= 1 && n <= channelList().length) switchChannel(n - 1); else $("#osd").classList.remove("show"); }, 900);
    return;
  }
  const inPanel = anyPanel();
  switch (k){
    case " ": case "k": case "K": case "MediaPlayPause": if (inPanel && e.target.closest?.(".panel")) return; e.preventDefault(); togglePlay(); break;
    case "ArrowRight": case "ArrowLeft": case "ArrowUp": case "ArrowDown":
      if (inPanel){ e.preventDefault(); panelNav(k); return; }
      e.preventDefault();
      if (e.shiftKey && (k === "ArrowRight" || k === "ArrowLeft")){ seekBy(k === "ArrowRight" ? 10 : -10); ripple(k === "ArrowRight" ? "r" : "l"); break; }
      if (k === "ArrowRight") next(); else if (k === "ArrowLeft") prev(); else switchChannel(k === "ArrowUp" ? S.chIdx + 1 : S.chIdx - 1);
      break;
    case "MediaTrackNext": case "l": case "L": if (inPanel) return; next(); break;
    case "MediaTrackPrevious": case "j": case "J": if (inPanel) return; prev(); break;
    case "ChannelUp": case "PageUp": if (inPanel) return; e.preventDefault(); switchChannel(S.chIdx + 1); break;
    case "ChannelDown": case "PageDown": if (inPanel) return; e.preventDefault(); switchChannel(S.chIdx - 1); break;
    case "c": case "C": if (!$("#bcast").hidden) cast(); break;
    case "t": case "T": toggleSubs(); break;
    case "e": case "E": shareItem(); break;
    case "p": case "P": if (CAN_PIP) togglePip(); break;
    case "m": case "M": toggleMute(); break;
    case "f": case "F": toggleFull(); break;
    case "g": case "G": case "ContextMenu": openPanel("guide"); break;
    case "b": case "B": openPanel("browse"); break;
    case "w": case "W": openLib(); break;
    case "o": case "O": openPanel("layers"); break;
    case "i": case "I": openPanel("info"); break;
    case "s": case "S": toggleFav(); break;
    case "v": case "V": if (!$("#blive").hidden) backToLive(); break;
    case "h": case "H": {
      const isClean = OVERLAYS.filter(x => x.k && x.k !== "ambient" && x.k !== "subs").every(x => !O[x.k]);
      if (isClean){ Object.assign(O, store.get("ovBeforeClean", PRESETS.tv.o)); toast(t("layersBack")); }
      else { store.set("ovBeforeClean", {...O}); Object.assign(O, PRESETS.clean.o); toast(t("cleanOn")); }
      applyOverlays(); if (isOpen("layers")) renderLayers(); break; }
    case "Escape": case "Backspace": case "BrowserBack": case "GoBack":
      if (inPanel){ e.preventDefault(); if (!$("#bdet").hidden) $("#bdet").hidden = true; else closePanels(); } break;
    case "Enter": if (!inPanel){ showLower(S.items[S.idx]); kickUI(); } break;
    default: return;
  }
  kickUI();
});

async function keepAwake(){ try{ if ("wakeLock" in navigator && document.visibilityState === "visible") S.wake = await navigator.wakeLock.request("screen"); }catch(e){} }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !S.started) return;
  keepAwake();
  if (PL.mode === "direct" && V.paused && !S.userPaused && V.getAttribute("src")) V.play().catch(() => {});
  if (S.live && S.items[S.idx]){ const i = liveCatchUp(S.idx); if (i !== S.idx) play(i); }   // după o pauză lungă, revino la ce rulează acum
});

async function start(opts = {}){
  if (S.started) return; S.started = true;
  // iOS/Android: primul play() pornește direct din atingere, ca să meargă și sunetul
  if (S.firstSrc && netMode() === "direct" && !V.getAttribute("src") && !opts.noplay){ V.src = S.firstSrc; V.volume = P.vol; V.muted = P.muted; V.play().catch(() => {}); }
  $("#splash").classList.add("hide");
  if (!KIOSK && !STANDALONE && (TOUCH || innerWidth < 900) && !opts.noplay) toggleFull(true);   // aplicația instalată are deja ecran fără bare: nu cerem ecran complet (evită mesajul Android „pentru a ieși…”)
  setTimeout(() => $("#rotate").classList.add("gone"), 7000);
  reTranslate(true);
  keepAwake(); applyOverlays(); syncVol(); syncFav(); updateLiveUI();
  if (!KIOSK && !P.p2pAck && netMode() === "p2p") setTimeout(() => { $("#p2pnote").hidden = false; }, 2500);
  if (opts.noplay) return;
  osd(); noise(500);
  await S.ready;
  const opened = !KIOSK && await openDeepLink(true);       // link cu ancoră (#v=…): deschide direct acel video
  if (opened){ /* playItemNow a pornit deja videoul */ }
  else if (S.items.length) play(0, {offset:S.firstOffset || 0}); else switchChannel(S.chIdx);
  if (!opts.keepPanel) kickUI();
}
$("#go").onclick = () => start();

$("#p2pDirect").onclick = () => { P.net = "direct"; P.p2pAck = true; savePrefs(); $("#p2pnote").hidden = true;

applyPlatform(); applyOverlays(); applyLang(); syncPlay(); syncVol(); syncFav(); pickEngine(false);

async function bootCatalog(){
  if (navigator.onLine === false){   // fără rețea: nu încerca cereri care oricum eșuează; reîncearcă la „online”
    S.netFail = true;
    const l0 = channelList(); S.chIdx = Math.min(Math.max(0, P.ch), l0.length - 1); S.ch = l0[S.chIdx]; renderChannels();

  }

  if (f) getVideo(f.v).then(v => { S.firstSrc = pickSrc(v); f.dur = v.duration || f.dur; f.preview = ptImage(v, f.v.host) || f.img; }).catch(() => {});
}
S.ready = bootCatalog();
addEventListener("online", () => { if (S.netFail && !S.items.length){ const was = S.started; S.ready = bootCatalog(); if (was) S.ready.then(() => { if (!S.items.length) switchChannel(S.chIdx); else play(0, {offset:S.firstOffset || 0}); }); } });

/* ---- pictograma aplicației generată la rulare (varianta într-un singur fișier) ---- */
function makeIcons(){
  if (BUILD.target === "hosted") return;
  try{
    const c = document.createElement("canvas"); c.width = c.height = 512; const x = c.getContext("2d");
    const g = x.createRadialGradient(256, 200, 20, 256, 256, 360); g.addColorStop(0, "#10261f"); g.addColorStop(1, "#000");
    x.fillStyle = g; x.fillRect(0, 0, 512, 512);
    const rr = (X, Y, W, H, R) => { x.beginPath(); x.moveTo(X + R, Y); x.arcTo(X + W, Y, X + W, Y + H, R); x.arcTo(X + W, Y + H, X, Y + H, R); x.arcTo(X, Y + H, X, Y, R); x.arcTo(X, Y, X + W, Y, R); x.closePath(); };
    const X0 = 56, Y0 = 176, W = 400, H = 160, half = 200;
    const gr = x.createLinearGradient(X0 + half, Y0, X0 + W, Y0 + H); gr.addColorStop(0, "#4fd1a5"); gr.addColorStop(1, "#3aa0ff");
    x.save(); rr(X0, Y0, W, H, 34); x.clip(); x.fillStyle = gr; x.fillRect(X0 + half, Y0, W - half, H); x.restore();
    x.lineWidth = 12; x.strokeStyle = "#fff"; x.beginPath();
    x.moveTo(X0 + half, Y0 + 6); x.lineTo(X0 + 34, Y0 + 6); x.arcTo(X0 + 6, Y0 + 6, X0 + 6, Y0 + 34, 28); x.lineTo(X0 + 6, Y0 + H - 34);
    x.arcTo(X0 + 6, Y0 + H - 6, X0 + 34, Y0 + H - 6, 28); x.lineTo(X0 + half, Y0 + H - 6); x.stroke();
    x.font = "700 118px VNTVDisplay, 'Arial Narrow', Arial, sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
    x.fillStyle = "#fff"; x.fillText("VN", X0 + half / 2 + 4, Y0 + H / 2 + 6);
    x.fillStyle = "#04130d"; x.fillText("TV", X0 + half + (W - half) / 2, Y0 + H / 2 + 6);
    const png = c.toDataURL("image/png");
    $("#appleicon").href = png;
  }catch(e){}
}
(document.fonts?.ready || Promise.resolve()).then(makeIcons);
