# Publică varianta găzduită (deploy/site) pe GitHub Pages: https://chiuta.github.io/VNTV/
# Setări repo: Settings → Pages → Source = "GitHub Actions".
name: Pages
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26 }
      - run: node build.mjs                      # nu cere npm install: build.mjs folosește doar Node
      - run: cp dist/vntv.html deploy/site/vntv.html   # varianta într-un singur fișier, de descărcat
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: deploy/site }
      - id: d
        uses: actions/deploy-pages@v5
