name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3" }
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - name: Teste (lint, aplicație, plugin PHP, addon)
        shell: bash
        run: |
          set +e
          npm run test:all 2>&1 | tee /tmp/test-all.log; rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            tr '\r' '\n' < /tmp/test-all.log | grep -a -E "^✘|FAIL|rror:|Error|error " -A2 | head -12 | cut -c1-300 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          fi
          exit $rc
      - name: Pagina comisă corespunde sursei
        shell: bash
        run: |
          # build.mjs preia kitul din index.html comis; dacă `src/` s-a schimbat fără ca paginile să fie reconstruite (și re-aplicat kitul din hub), paginile diferă
          node build.mjs
          if ! git diff --exit-code --stat -- index.html sw.js manifest.webmanifest icons deploy dist; then
            echo "::error::Paginile comise (index.html, deploy/, dist/) diferă de ce produce «node build.mjs»: rulați «node build.mjs», apoi «node fff-kit/build.mjs release . --bump none --lax» din hub, apoi iar «node build.mjs», și comiteți"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: vntv, path: "dist/vntv.html" }
